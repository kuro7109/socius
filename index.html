<body>
<div id="v-land"></div>
<div id="v-login" hidden></div>

<div id="v-app" class="app" hidden>
  <aside class="side">
    <div class="side-top"><button class="logo logobtn" id="sideLogo" aria-label="Socius, go to Home" title="Go to Home"></button><button class="sidecol" id="sideCol" aria-label="Collapse side panel" title="Collapse side panel" aria-expanded="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="M15 10l-2 2 2 2"/></svg></button></div>

      <button data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>HOME</span></button>

      <button data-page="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>PROGRESS</span></button>

    <header class="dk-h"><div class="dk-tabs" role="tablist"><button role="tab" data-dt="milo">Ask Milo</button><button role="tab" data-dt="chats">Chats</button></div>
      <button class="dk-ic" id="dkFull" aria-label="Expand to full screen" title="Full screen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="dk-ic" id="dkX" aria-label="Close panel" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
